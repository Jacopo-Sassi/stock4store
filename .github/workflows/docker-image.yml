name: Create and publish Docker images for backend and python-ai (amd64)

# Run on pushes to main
on:
  push:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ${{ github.repository }}-backend
  IMAGE_NAME_PYAI: ${{ github.repository }}-python-ai

jobs:
  build-and-push-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Ensure buildx is available and a builder instance is created
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      ########################
      # Backend image
      ########################
      - name: Extract metadata for backend image
        id: meta-backend
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}

      - name: Build and push backend Docker image (amd64)
        id: build-push-backend
        uses: docker/build-push-action@v4
        with:
          # ensure the build uses the Buildx instance created above
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      ########################
      # python-ai image
      ########################
      - name: Extract metadata for python-ai image
        id: meta-pyai
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PYAI }}

      - name: Build and push python-ai Docker image (amd64)
        id: build-push-pyai
        uses: docker/build-push-action@v4
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: python-ai
          file: python-ai/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta-pyai.outputs.tags }}
          labels: ${{ steps.meta-pyai.outputs.labels }}
