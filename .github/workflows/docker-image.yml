name: Create and publish Docker images for backend and python-ai (amd64)

# Run on pushes to main
on:
  push:
    branches: ["main"]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v2

      - name: Compute lowercase owner and repo
        id: vars
        run: |
          # GITHUB_REPOSITORY is OWNER/REPO; extract owner and repo and lowercase them
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          owner_lower=$(echo "$owner" | tr '[:upper:]' '[:lower:]')
          repo_lower=$(echo "$repo" | tr '[:upper:]' '[:lower:]')
          # lower_repo contains lower owner/repo as requested
          lower_repo="${owner_lower}/${repo_lower}"
          echo "owner=${owner_lower}" >> $GITHUB_OUTPUT
          echo "repo=${repo_lower}" >> $GITHUB_OUTPUT
          echo "lower_repo=${lower_repo}" >> $GITHUB_OUTPUT

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      ########################
      # Backend image
      ########################
      - name: Build and push backend Docker image (amd64)
        id: build-push-backend
        uses: docker/build-push-action@v4
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          push: true
          platforms: linux/amd64
          # Single explicit tag (quoted in YAML list) to avoid metadata-based multiple tags
          tags:
            - ghcr.io/${{ steps.vars.outputs.lower_repo }}-backend:${{ github.sha }}

      ########################
      # python-ai image
      ########################
      - name: Build and push python-ai Docker image (amd64)
        id: build-push-pyai
        uses: docker/build-push-action@v4
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: python-ai
          file: python-ai/Dockerfile
          push: true
          platforms: linux/amd64
          tags:
            - ghcr.io/${{ steps.vars.outputs.lower_repo }}-python-ai:${{ github.sha }}
