name: Create and publish Docker images for backend and python-ai (amd64)

# Run on pushes to main
on:
  push:
    branches: ["main"]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v2

      - name: Compute lowercase repository name
        id: vars
        run: |
          # GITHUB_REPOSITORY is OWNER/REPO; convert it to lowercase for valid image names
          echo "lower_repo=$(echo \"${GITHUB_REPOSITORY}\" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      ########################
      # Backend image
      ########################
      - name: Extract metadata for backend image
        id: meta-backend
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ steps.vars.outputs.lower_repo }}-backend

      - name: Build and push backend Docker image (amd64)
        id: build-push-backend
        uses: docker/build-push-action@v4
        with:
          # ensure the build uses the Buildx instance created above
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          push: true
          platforms: linux/amd64
          # Use a single explicit tag to avoid multiple tag entries
          tags: ${{ env.REGISTRY }}/${{ steps.vars.outputs.lower_repo }}-backend:${{ github.sha }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      ########################
      # python-ai image
      ########################
      - name: Extract metadata for python-ai image
        id: meta-pyai
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ steps.vars.outputs.lower_repo }}-python-ai

      - name: Build and push python-ai Docker image (amd64)
        id: build-push-pyai
        uses: docker/build-push-action@v4
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: python-ai
          file: python-ai/Dockerfile
          push: true
          platforms: linux/amd64
          # Single explicit tag for python-ai
          tags: ${{ env.REGISTRY }}/${{ steps.vars.outputs.lower_repo }}-python-ai:${{ github.sha }}
          labels: ${{ steps.meta-pyai.outputs.labels }}
