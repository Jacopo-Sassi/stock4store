version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-db-PW
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: myappdb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d myappdb" ]  # ← E qui
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: ./python-ai
      dockerfile: Dockerfile
    container_name: pw_ai_service
    environment:
      - FLASK_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=myappdb
      - DB_USER=admin
      - DB_PASSWORD=admin123
      - MODEL_PATH=/app/models/mistral-7b-instruct-v0.2.Q4_K_M.gguf
    ports:
      - "5001:5001"
    volumes:
      - ./python-ai/models:/app/models
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy



  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pw_backend
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5433/myappdb
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=admin123
      - AI_SERVICE_URL=http://ai-service:5001
    ports:
      - "8080:8080"
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
