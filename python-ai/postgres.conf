# postgres.conf (base tuning per container ~2GB RAM)

shared_buffers = 512MB          # ~25% della RAM del container
work_mem = 16MB                 # per sort/agg complessi
effective_cache_size = 1536MB   # ~75% della RAM del container
maintenance_work_mem = 256MB
max_connections = 100
max_parallel_workers = 4
max_parallel_workers_per_gather = 2
wal_buffers = 16MB
