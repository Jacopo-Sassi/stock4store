[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    parallel: tests that can safely run in parallel

addopts =
    -v
    --tb=short
    --strict-markers
    -n auto                 # pytest-xdist: usa tutti i core disponibili
    --dist=loadfile         # distribuisce per file, spesso più efficiente [web:113]
    --maxfail=1             # ferma subito al primo fail (sviluppo)
    --last-failed-no-failures all  # se nessun last-failed, esegui tutto [web:108]
