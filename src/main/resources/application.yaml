
spring:
    application:
        name: PW_BE

    datasource:
        url: jdbc:postgresql://localhost:5432/postgres-db-PW
        username: admin
        password: admin123
        driver-class-name: org.postgresql.Driver

    jpa:
        hibernate:
            ddl-auto: none
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect
                format_sql: true
        show-sql: true

    sql:
        init:
            mode: always

    liquibase:
        enabled: true
        change-log: classpath:db/changelog/changelog-master.yaml

server:
    port: 8080

logging:
    level:
        org.hibernate.SQL: DEBUG
        org.hibernate.type.descriptor.sql.BasicBinder: TRACE
